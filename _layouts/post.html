---
layout: base
---
<article class="post">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← All posts</a>

  <header class="post-header">
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%b %-d, %Y' }}</time>
      · {% include reading-time.html content=content %}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.summary %}<p class="post-lead">{{ page.summary }}</p>{% endif %}
  </header>

  {% if page.cover %}
  <img class="post-cover" src="{{ page.cover | relative_url }}" alt="">
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>
</article>
